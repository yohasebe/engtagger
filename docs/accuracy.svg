<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="719" height="249" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <!-- subtitle -->
  <text x="20" y="27" font-size="12" fill="#52514e">Token accuracy (%) on Universal Dependencies test sets, Penn Treebank tagset</text>

  <!-- legend -->
  <circle cx="556" cy="22" r="5" fill="#2a78d6"/>
  <text x="566" y="26" font-size="12" fill="#0b0b0b">EWT test</text>
  <circle cx="636" cy="22" r="5" fill="#eb6834"/>
  <text x="646" y="26" font-size="12" fill="#0b0b0b">GUM test</text>

  <!-- gridlines -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="200" y1="46" x2="200" y2="210"/>
    <line x1="322.5" y1="46" x2="322.5" y2="210"/>
    <line x1="445" y1="46" x2="445" y2="210"/>
    <line x1="567.5" y1="46" x2="567.5" y2="210"/>
    <line x1="690" y1="46" x2="690" y2="210"/>
  </g>
  <line x1="200" y1="210" x2="690" y2="210" stroke="#c3c2b7" stroke-width="1"/>

  <!-- axis labels -->
  <g font-size="11" fill="#898781" text-anchor="middle">
    <text x="200" y="228">80</text>
    <text x="322.5" y="228">85</text>
    <text x="445" y="228">90</text>
    <text x="567.5" y="228">95</text>
    <text x="690" y="228">100</text>
  </g>

  <!-- row 1: EngTagger 0.4.3 (HMM) *  EWT 84.9 / GUM 88.4 -->
  <text x="185" y="72" font-size="12.5" fill="#0b0b0b" text-anchor="end">EngTagger 0.4.3 (HMM) *</text>
  <line x1="320" y1="68" x2="406" y2="68" stroke="#e1e0d9" stroke-width="2"/>
  <circle cx="320" cy="68" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="406" cy="68" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="310" y="72" font-size="11" fill="#52514e" text-anchor="end">84.9</text>
  <text x="416" y="72" font-size="11" fill="#52514e">88.4</text>

  <!-- row 2: NLTK 3.10.3 (perceptron)  EWT 85.1 / GUM 90.4 -->
  <text x="185" y="110" font-size="12.5" fill="#0b0b0b" text-anchor="end">NLTK 3.10.3 (perceptron)</text>
  <line x1="325" y1="106" x2="455" y2="106" stroke="#e1e0d9" stroke-width="2"/>
  <circle cx="325" cy="106" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="455" cy="106" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="315" y="110" font-size="11" fill="#52514e" text-anchor="end">85.1</text>
  <text x="465" y="110" font-size="11" fill="#52514e">90.4</text>

  <!-- row 3: EngTagger 2.0 (perceptron)  EWT 94.2 / GUM 95.7 -->
  <text x="185" y="148" font-size="12.5" fill="#0b0b0b" text-anchor="end"><tspan font-weight="600">EngTagger 2.0</tspan> (perceptron)</text>
  <line x1="548" y1="144" x2="585" y2="144" stroke="#e1e0d9" stroke-width="2"/>
  <circle cx="548" cy="144" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="585" cy="144" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="538" y="148" font-size="11" fill="#52514e" text-anchor="end">94.2</text>
  <text x="595" y="148" font-size="11" fill="#52514e">95.7</text>

  <!-- row 4: Stanza 1.15.1 (neural)  EWT 96.2 / GUM 97.6 -->
  <text x="185" y="186" font-size="12.5" fill="#0b0b0b" text-anchor="end">Stanza 1.15.1 (neural)</text>
  <line x1="597" y1="182" x2="631" y2="182" stroke="#e1e0d9" stroke-width="2"/>
  <circle cx="597" cy="182" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="631" cy="182" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="587" y="186" font-size="11" fill="#52514e" text-anchor="end">96.2</text>
  <text x="641" y="186" font-size="11" fill="#52514e">97.6</text>
</svg>
